[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "structsolve"
version = "0.9.1"
description = "Structural analysis solvers"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Saullo G. P. Castro", email = "castrosaullo@gmail.com" },
]
keywords = [
    "structural analysis", "stress", "vibration", "linear buckling",
    "newton raphson", "arc length",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Environment :: WebAssembly :: Emscripten",
]
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "flake8",
    "coverage",
]

[project.urls]
Homepage = "https://github.com/saullocastro/structsolve"
Documentation = "https://saullocastro.github.io/structsolve/"
Repository = "https://github.com/saullocastro/structsolve"

[tool.setuptools.packages.find]
include = ["structsolve*"]
