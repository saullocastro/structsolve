name: coverage

on: [push]

jobs:
  build:

    strategy:
      matrix:
        runs-on: [ubuntu-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.runs-on }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install module with test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[test]"
    - name: Test with pytest and coverage, without oneMKL
      run: |
        STRUCTSOLVE_MKL_RT=/nonexistent/libmkl_rt.so coverage run -m pytest tests
    - name: Install oneMKL, for linear_solver='pardiso'
      run: |
        python -m pip install ".[pardiso]"
        python -c "import structsolve.pardiso as p; assert p.available()"
    - name: Test with pytest and coverage, with oneMKL
      run: |
        coverage run --append -m pytest tests
        coverage report
    - name: "Upload coverage to Codecov"
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_UPLOAD_TOKEN }}
        fail_ci_if_error: true
        verbose: true
